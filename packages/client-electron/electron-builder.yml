# A single, runnable Windows app plus a per-user installer (ADR-006).
# `ws` is the only runtime dependency (everything else is bundled into `out/`);
# `node:sqlite` is built into Electron.
appId: com.adt.client-electron
productName: ADT

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  # rcedit CANNOT commit on this machine: `Fatal error: Unable to commit
  # changes` (retried 4x). Rather than fail the whole build, we skip writing the
  # exe's own icon/version metadata — the installer is still produced, but the
  # app exe keeps Electron's default icon. This is a KNOWN, DOCUMENTED downgrade
  # (client-packaging plan, Task 3), not a silent one: remove this line on a
  # machine where rcedit works.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ADT-${version}-setup.${ext}
