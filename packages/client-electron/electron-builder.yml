# A single, runnable Windows app plus a per-user installer (ADR-006).
# `ws` is the only runtime dependency (everything else is bundled into `out/`);
# `node:sqlite` is built into Electron.
appId: com.adt.client-electron
productName: ADT

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - nsis
    - portable
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ADT-${version}-setup.${ext}
