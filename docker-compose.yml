services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adt
      POSTGRES_PASSWORD: adt
      POSTGRES_DB: adt
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adt -d adt"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - blobs:/app/.adt/blobs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  blobs:
